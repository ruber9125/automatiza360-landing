<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 32" width="200" height="32">
  <title>Automatiza360</title>
  <defs>
    <linearGradient id="anillo" x1="4" y1="4" x2="28" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4f7cff"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="nodo" x1="21" y1="19" x2="28" y2="26" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#4f7cff"/>
    </linearGradient>
    <linearGradient id="cifra" x1="150" y1="10" x2="196" y2="26" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4f7cff"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>

  <path d="M26.89 17.53A11 11 0 1 0 21.16 25.71" fill="none" stroke="url(#anillo)" stroke-width="3.4" stroke-linecap="round"/>
  <circle cx="25.01" cy="22.31" r="2.9" fill="url(#nodo)"/>
  <circle cx="16" cy="16" r="2.5" fill="#4f7cff"/>

  <!-- El texto usa currentColor: hereda el color del contenedor, asi que
       funciona sobre fondo claro y oscuro sin editar el archivo. -->
  <text x="42" y="22" font-family="Plus Jakarta Sans, Segoe UI, Helvetica, Arial, sans-serif"
        font-size="18" font-weight="700" letter-spacing="-0.45" fill="currentColor">Automatiza<tspan fill="url(#cifra)">360</tspan></text>
</svg>
